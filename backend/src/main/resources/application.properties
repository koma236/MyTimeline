spring.application.name=mytimeline

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mytimeline}
spring.datasource.username=${DB_USER:mytimelineuser}
spring.datasource.password=${DB_PASSWORD:mytimelinepassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# users.display_name -> User.displayName のスネークケース→キャメルケース変換
mybatis.configuration.map-underscore-to-camel-case=true
# JOIN や動的条件を含む SQL は XML マッパーに置く（例: PostMapper.xml）
mybatis.mapper-locations=classpath:mapper/*.xml

# スキーマの唯一の情報源は Flyway（backend/src/main/resources/db/migration）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:local-development-only-secret-key-please-override-me}
# アクセストークンは短命にし、切れたらリフレッシュトークンで取り直す
app.jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:14}
# 本番（HTTPS）では true。localhost の HTTP 開発では true にすると Cookie が送られない
app.jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

# CORS の許可オリジン（カンマ区切り・ワイルドカード可）。
# 既定は開発用。本番では CORS_ALLOWED_ORIGINS で配信ドメインだけに絞ること
# （allow-credentials=true なので、緩いと手元のページから認証付きで API を叩けてしまう）
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:*}

# オブジェクトストレージ（ローカルは MinIO、本番は AWS S3）。
# endpoint を空にすると endpointOverride を付けず、本物の S3 に接続する
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
# 署名付き URL に載るホスト。ブラウザから到達できる必要がある。
# SigV4 は Host を署名対象に含むため、内部ホストで署名した URL は
# ブラウザから開けない（compose ではアプリ→minio:9000 / ブラウザ→localhost:9000）
app.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
app.s3.bucket=${S3_BUCKET:mytimeline-images}
app.s3.region=${S3_REGION:ap-northeast-1}
# 空なら DefaultCredentialsProvider（本番は EC2 の IAM ロールから取得）
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
# MinIO では必須。false（仮想ホスト形式）だと bucket.localhost になり名前解決できない
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
app.s3.avatar-url-expiration-minutes=${S3_AVATAR_URL_EXPIRATION_MINUTES:60}

# アプリ側の上限（ImageValidator: 2MB）より大きくしておく。
# ここを 2MB にすると Spring が先に弾いてしまい、項目付きの丁寧なエラーを返せない。
# リクエスト全体は投稿の最大 4 枚（F03）がぎりぎり通る余裕を持たせる
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB

management.endpoints.web.exposure.include=health

# API 仕様書（springdoc）。/v3/api-docs と /swagger-ui.html を自動生成する。
# 内部構造を公開しないよう、本番では SPRINGDOC_ENABLED=false で両方とも無効化すること
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

server.port=8080

# テスト専用の DB 設定（@ActiveProfiles("test") で読む）。
#
# 開発用 PostgreSQL（docker-compose）には一切触れない。テストが書き込んだデータで
# 手元の動作確認がおかしくなったり、逆に手元のデータでテストが不安定になるのを防ぐため、
# インメモリの H2 を PostgreSQL 互換モードで起動し、本番と同じ Flyway マイグレーションを流す。
#
# - MODE=PostgreSQL: BIGSERIAL / ON CONFLICT DO NOTHING / ILIKE など PG 構文を受け付ける
# - DATABASE_TO_LOWER=TRUE: 識別子を小文字で扱い、PG と同じ挙動にする
# - DEFAULT_NULL_ORDERING=HIGH: ORDER BY での NULL の並びを PG に合わせる
# - DB_CLOSE_DELAY=-1: 最後の接続が閉じても DB を捨てない（コンテキストのキャッシュ間で共有する）
spring.datasource.url=jdbc:h2:mem:mytimeline;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

plugins {
	id 'java'
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.4.7'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	// Spring Boot の BOM 管理外のため明示する。
	// mybatis-spring-boot-starter は 4.0.x 系が Spring Boot 4.0 対応。
	mybatisStarterVersion = '4.0.1'
	jjwtVersion = '0.12.6'
	// AWS SDK も Spring Boot の BOM 管理外。個別に版を書くとモジュール間でずれるので BOM を使う
	awsSdkVersion = '2.35.11'
	// springdoc は 3.x 系が Spring Boot 4 対応（2.x 系は Boot 3 用なので上げないこと）
	springdocVersion = '3.1.0'
}

checkstyle {
	toolVersion = '10.26.1'
	configFile = file('config/checkstyle/checkstyle.xml')
	// 違反があればビルドを失敗させる（警告として見逃さない）
	ignoreFailures = false
	maxWarnings = 0
}

// Checkstyle は「書き方」しか見ない（命名・空白・波かっこ）。
// NullPointerException になりうる参照や握りつぶした例外のような「動かすと壊れる」類は
// バイトコードを解析する SpotBugs でないと拾えないため、両方を有効にしている。
spotbugs {
	toolVersion = '4.9.8'
	// 精度優先。このプロジェクトの規模なら解析時間は問題にならない。
	// enum 定数が class body を持つため、定数を直接参照すると Gradle が
	// 無名サブクラスと見なして変換に失敗する。valueOf で渡すこと
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	excludeFilter = file('config/spotbugs/exclude.xml')
	// checkstyle と同じく、違反があればビルドを失敗させる
	ignoreFailures = false
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		// CI 向けの XML より、ローカルでそのまま開ける HTML を既定にする
		html.required = true
		xml.required = false
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// DTO の null 許容を @Nullable で宣言する（Spring Framework 7 自体も採用している注釈）。
	// OpenApiConfig がこれを読んで API 仕様書の required / nullable に反映する
	implementation 'org.jspecify:jspecify:1.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisStarterVersion}"
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
	// アバター画像の保存先。S3Presigner も s3 モジュールに同梱されている。
	// 同期 HTTP クライアント（apache-client）と非同期（netty-nio-client）が推移的に付いてくる。
	// url-connection-client を足すと同期実装が 2 つになり、起動時に
	// Multiple HTTP implementations were found で落ちるので追加しないこと
	implementation 'software.amazon.awssdk:s3'
	// API 仕様書（OpenAPI / Swagger UI）をコントローラと DTO から自動生成する
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Spring Boot 4 では @WebMvcTest などの MVC テストスライスが別モジュールに分離されている
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

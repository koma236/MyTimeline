services:
  db:
    image: postgres:15
    container_name: mytimeline_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # created_at / updated_at はタイムゾーンを持たない TIMESTAMP で保存し、
      # API もタイムゾーン無しの文字列で返す。コンテナが既定の UTC のままだと
      # ブラウザが JST として解釈して 9 時間ずれるため、DB 側の時刻を JST に揃える
      # （docs/09_infrastructure.md のリージョンは ap-northeast-1）
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 本番の S3 の代わりにローカルで動かす S3 互換ストレージ。
  # アプリのコードは AWS SDK のままで、接続先の設定だけが変わる
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mytimeline_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      TZ: Asia/Tokyo
    ports:
      # 9000 が API、9001 が管理コンソール
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # バケットを 1 度だけ作って終了する使い捨てコンテナ。
  # アプリ起動時に CreateBucket する案は採らない。本番の IAM ロールに
  # s3:CreateBucket を与えることになり、最小権限から外れるため
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: mytimeline_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-mytimeline-images}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mytimeline_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE}
      # 既存の .env に未設定でも動くよう、compose 側で開発既定値を持たせる
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:*}
      # コンテナ間はサービス名で到達する。一方、署名付き URL を開くのはブラウザなので
      # 公開側は localhost を使う。SigV4 は Host を署名対象に含むため、
      # ここを取り違えると発行した URL が 403 になる
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-mytimeline-images}
      S3_REGION: ${S3_REGION:-ap-northeast-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      # db と同じ理由で JST に揃える
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:

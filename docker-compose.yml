services:
  db:
    image: postgres:15
    container_name: mytimeline_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # created_at / updated_at はタイムゾーンを持たない TIMESTAMP で保存し、
      # API もタイムゾーン無しの文字列で返す。コンテナが既定の UTC のままだと
      # ブラウザが JST として解釈して 9 時間ずれるため、DB 側の時刻を JST に揃える
      # （docs/09_infrastructure.md のリージョンは ap-northeast-1）
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mytimeline_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE}
      # db と同じ理由で JST に揃える
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYTIMELINE - プロトタイプモック</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- モックであることを示すバー（本番画面には存在しない） -->
  <div class="mock-bar">
    <span class="mock-bar__label">PROTOTYPE MOCK</span>
    <span class="mock-bar__note">静的モック（localStorage 保存）。DB / S3 は使用していません</span>
    <div class="mock-bar__actions">
      <select id="mock-user-switch" class="mock-bar__select" title="シードユーザーに切り替えてログインし直します">
        <option value="">ユーザー切替…</option>
      </select>
      <button type="button" id="mock-reset" class="mock-bar__btn">データリセット</button>
    </div>
  </div>

  <!-- 共通ヘッダー（ログイン中のみ表示） -->
  <header class="header" id="header" hidden>
    <div class="header__inner">
      <a class="header__logo" href="#/timeline">MYTIMELINE</a>
      <nav class="header__nav">
        <a class="header__link" href="#/search">🔍 検索</a>
        <a class="header__link" id="header-profile" href="#/timeline">プロフィール</a>
        <button type="button" class="header__link header__link--btn" id="header-logout">ログアウト</button>
      </nav>
    </div>
  </header>

  <main class="main" id="view"></main>

  <div class="toast" id="toast" hidden></div>

  <!-- ============ 画面テンプレート ============ -->

  <!-- SCR-01 ログイン -->
  <template id="tpl-login">
    <div class="auth">
      <h1 class="auth__title">MYTIMELINE</h1>
      <p class="auth__lead">いま起きていることを、シンプルに。</p>
      <form class="auth__form" data-form="login" novalidate>
        <div class="field">
          <label class="field__label" for="login-id">メールアドレス または ユーザー名</label>
          <input class="field__input" id="login-id" name="identifier" type="text" autocomplete="username">
          <p class="field__error" data-error="identifier"></p>
        </div>
        <div class="field">
          <label class="field__label" for="login-pw">パスワード</label>
          <input class="field__input" id="login-pw" name="password" type="password" autocomplete="current-password">
          <p class="field__error" data-error="password"></p>
        </div>
        <p class="form__error" data-error="_form"></p>
        <button class="btn btn--primary btn--block" type="submit">ログイン</button>
      </form>
      <p class="auth__switch">アカウントをお持ちでない方 → <a href="#/signup">新規登録</a></p>
      <p class="auth__hint">モック用テストアカウント: <code>taro</code> / <code>password123</code></p>
    </div>
  </template>

  <!-- SCR-02 新規登録 -->
  <template id="tpl-signup">
    <div class="auth">
      <h1 class="auth__title">アカウント作成</h1>
      <form class="auth__form" data-form="signup" novalidate>
        <div class="field">
          <label class="field__label" for="su-username">ユーザー名（@username）</label>
          <input class="field__input" id="su-username" name="username" type="text" placeholder="taro">
          <p class="field__help">3〜50文字・半角英数字とアンダースコア</p>
          <p class="field__error" data-error="username"></p>
        </div>
        <div class="field">
          <label class="field__label" for="su-display">表示名</label>
          <input class="field__input" id="su-display" name="displayName" type="text" placeholder="山田太郎">
          <p class="field__error" data-error="displayName"></p>
        </div>
        <div class="field">
          <label class="field__label" for="su-email">メールアドレス</label>
          <input class="field__input" id="su-email" name="email" type="text" placeholder="taro@example.com">
          <p class="field__error" data-error="email"></p>
        </div>
        <div class="field">
          <label class="field__label" for="su-password">パスワード</label>
          <input class="field__input" id="su-password" name="password" type="password">
          <p class="field__help">8文字以上</p>
          <p class="field__error" data-error="password"></p>
        </div>
        <div class="field">
          <label class="field__label" for="su-bio">自己紹介（任意）</label>
          <textarea class="field__input field__input--area" id="su-bio" name="bio" rows="2" maxlength="300"></textarea>
          <p class="field__error" data-error="bio"></p>
        </div>
        <p class="form__error" data-error="_form"></p>
        <button class="btn btn--primary btn--block" type="submit">登録する</button>
      </form>
      <p class="auth__switch">すでにアカウントをお持ちの方 → <a href="#/login">ログイン</a></p>
    </div>
  </template>

  <!-- SCR-03 タイムライン -->
  <template id="tpl-timeline">
    <div class="tabs" role="tablist">
      <button class="tabs__tab" role="tab" data-tab="all">すべて</button>
      <button class="tabs__tab" role="tab" data-tab="following">フォロー中</button>
    </div>

    <form class="composer" data-form="post" novalidate>
      <div class="composer__row">
        <div class="avatar" data-composer-avatar></div>
        <textarea class="composer__input" name="body" rows="3" placeholder="いま何してる？"></textarea>
      </div>
      <div class="composer__previews" data-image-previews hidden></div>
      <p class="field__error" data-error="images"></p>
      <p class="field__error" data-error="body"></p>
      <div class="composer__footer">
        <label class="composer__attach">
          🖼 画像を追加
          <input type="file" accept="image/jpeg,image/png" multiple hidden data-image-input>
        </label>
        <span class="composer__attach-count" data-image-count>0 / 4</span>
        <span class="composer__spacer"></span>
        <span class="composer__counter" data-counter>0 / 280</span>
        <button class="btn btn--primary" type="submit" data-submit>投稿</button>
      </div>
    </form>

    <div data-feed></div>
  </template>

  <!-- SCR-04 投稿詳細 -->
  <template id="tpl-post-detail">
    <div class="pagehead">
      <button class="pagehead__back" type="button" data-back>← 戻る</button>
      <h2 class="pagehead__title">投稿</h2>
    </div>
    <div data-post-body></div>
    <form class="composer composer--comment" data-form="comment" novalidate>
      <div class="composer__row">
        <div class="avatar" data-composer-avatar></div>
        <textarea class="composer__input" name="body" rows="2" placeholder="コメントを書く..."></textarea>
      </div>
      <p class="field__error" data-error="body"></p>
      <div class="composer__footer">
        <span class="composer__spacer"></span>
        <span class="composer__counter" data-counter>0 / 500</span>
        <button class="btn btn--primary" type="submit" data-submit>送信</button>
      </div>
    </form>
    <h3 class="section-title">コメント <span data-comment-count></span></h3>
    <div data-comments></div>
  </template>

  <!-- SCR-05 プロフィール -->
  <template id="tpl-profile">
    <div class="pagehead">
      <button class="pagehead__back" type="button" data-back>← 戻る</button>
      <h2 class="pagehead__title" data-head-name></h2>
    </div>
    <section class="profile">
      <div class="profile__top">
        <div class="avatar avatar--lg" data-avatar></div>
        <div data-follow-slot></div>
      </div>
      <p class="profile__name" data-display-name></p>
      <p class="profile__username" data-username></p>
      <p class="profile__bio" data-bio></p>
      <p class="profile__counts">
        <a class="profile__count" href="#" data-following-link><strong data-following-count>0</strong> フォロー中</a>
        <a class="profile__count" href="#" data-follower-link><strong data-follower-count>0</strong> フォロワー</a>
      </p>
    </section>
    <h3 class="section-title">投稿一覧</h3>
    <div data-feed></div>
  </template>

  <!-- SCR-06 ユーザー検索 -->
  <template id="tpl-search">
    <div class="pagehead">
      <button class="pagehead__back" type="button" data-back>← 戻る</button>
      <h2 class="pagehead__title">ユーザー検索</h2>
    </div>
    <div class="searchbar">
      <span class="searchbar__icon">🔍</span>
      <input class="searchbar__input" type="search" data-search-input placeholder="ユーザー名で検索..." maxlength="50">
    </div>
    <h3 class="section-title">検索結果</h3>
    <div data-results></div>
  </template>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
